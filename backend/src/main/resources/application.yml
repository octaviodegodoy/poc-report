server:
  port: 8080
  tomcat:
    max-http-form-post-size: -1   # remove limite do Tomcat (padrao 2MB bloqueia uploads grandes)

spring:
  application:
    name: poc-ingestao-transacao
  datasource:
    url: jdbc:postgresql://localhost:5432/ingestao
    username: ingestao
    password: ingestao
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
  mvc:
    async:
      request-timeout: -1   # sem limite: conversoes de JSON grande (GBs) podem levar vários minutos

# Origem permitida para o front Vite (CORS)
app:
  cors:
    allowed-origins: http://localhost:5173
  ingestao:
    batch-size: 5000
    worker-threads: 4   # aumentar se houver mais cores disponíveis

logging:
  level:
    br.com.vivo.ingestao: INFO