# Postgres provisório para a PoC de Ingestão TB_JSON_TRANSACAO
# Subir com:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: poc-ingestao-postgres
    environment:
      POSTGRES_DB: ingestao
      POSTGRES_USER: ingestao
      POSTGRES_PASSWORD: ingestao
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - poc_ingestao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestao -d ingestao"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  poc_ingestao_pgdata:
